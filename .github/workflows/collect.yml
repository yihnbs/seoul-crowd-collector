name: collect-citydata

on:
  schedule:
    - cron: "7,37 * * * *"   # 릴레이가 끊겼을 때 다시 살리는 예비용
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write             # 다음 실행을 스스로 시작하려면 필요

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 30분마다 수집 (약 5시간)
        timeout-minutes: 330
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: |
          git config user.name "citydata-bot"
          git config user.email "citydata-bot@users.noreply.github.com"
          for round in $(seq 1 11); do
            python collector/collect.py || echo "이번 회차 실패, 다음 회차에 다시 시도"
            git add data
            if ! git diff --cached --quiet; then
              git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
              for i in 1 2 3 4 5; do
                git push && break
                sleep 3
                git pull --rebase
              done
            fi
            if [ $round -lt 11 ]; then sleep 1800; fi
          done

      - name: 다음 릴레이 시작
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main
      
