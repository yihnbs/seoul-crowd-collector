name: collect-citydata

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collector/collect.py

      - name: 저장 (커밋)
        run: |
          git config user.name "citydata-bot"
          git config user.email "citydata-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "새 데이터 없음"; exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((RANDOM % 5 + 1))
            git pull --rebase
          done
          exit 1
